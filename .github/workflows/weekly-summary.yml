name: Weekly Slack article summary

on:
  schedule:
    # 12:07 UTC every Thursday, aiming to land well before 1pm US Eastern.
    # Deliberately early with a buffer, not timed close to the deadline:
    # GitHub Actions schedule events are best-effort and can run late under
    # high load (this once fired ~9h late), so there's no way to guarantee
    # an exact time — only to leave enough slack that a typical delay still
    # lands before 1pm. 12:07 UTC is before 1pm Eastern in both EDT (UTC-4,
    # deadline 17:00 UTC) and EST (UTC-5, deadline 18:00 UTC), so no DST
    # adjustment is needed. Also off the top of the hour (:07, not :00),
    # since GitHub deprioritizes schedule events at popular exact-hour times.
    - cron: "7 12 * * 4"
  workflow_dispatch: {}

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > service-account.json

      - name: Run summarizer
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_SUMMARY_CHANNEL: ${{ secrets.SLACK_SUMMARY_CHANNEL }}
          GOOGLE_CREDENTIALS_PATH: service-account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
          DAYS_BACK: "7"
        run: python summarize.py

      - name: Clean up credentials file
        if: always()
        run: rm -f service-account.json
